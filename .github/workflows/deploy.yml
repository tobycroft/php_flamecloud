name: Deploy to GitHub Repository

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
    - name: Setup SSH Key (Base64 decoded)
      env:
        SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      run: |
        mkdir -p ~/.ssh
        echo "${SSH_PRIVATE_KEY_B64}" | base64 -d > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        echo "✅ SSH key setup completed"
        
    - name: Push to target repository using SSH
      run: |
        git remote add target git@github.com:flamecloudcn/php_flamecloud_admin.git
        GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" git push target HEAD:main --force
        echo "✅ Successfully pushed to flamecloudcn/php_flamecloud_admin via SSH"