<script>
function submitReply() {
    var content = document.getElementById('replyContent').value.trim();
    if (!content) { showToast('请输入回复内容', 'error'); return; }
    var body = new URLSearchParams();
    body.append('id', <?=$ticket['id']?>);
    body.append('content', content);
    fetch("{:url('ticket/reply')}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
    }).then(function(r) { return r.json(); }).then(function(res) {
        showToast(res.msg, res.code === 0 ? 'success' : 'error');
        if (res.code === 0) setTimeout(function() { location.reload(); }, 600);
    });
}

function closeTicket() {
    if (!confirm('确定要结案关闭此工单吗？关闭后用户将收到通知。')) return;
    var body = new URLSearchParams();
    body.append('id', <?=$ticket['id']?>);
    fetch("{:url('ticket/close')}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
    }).then(function(r) { return r.json(); }).then(function(res) {
        showToast(res.msg, res.code === 0 ? 'success' : 'error');
        if (res.code === 0) setTimeout(function() { location.reload(); }, 600);
    });
}
</script>
