<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火焰云总后台 - 个人设置</title>
    {include file="common/head" /}
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

{include file="common/sidebar" /}

<div class="lg:ml-60 min-h-screen flex flex-col">
    <header class="sticky top-0 z-20 bg-white border-b border-gray-200 h-16 flex items-center px-4 lg:px-6">
        <button id="hamburger" class="lg:hidden mr-3 text-gray-500 hover:text-gray-700" onclick="toggleSidebar()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="pageTitle" class="text-lg font-semibold">个人设置</h1>
    </header>

    <main class="flex-1 p-6">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100">
                    <h2 class="text-lg font-semibold">安全设置</h2>
                    <p class="text-sm text-gray-400 mt-1">设置空闲超时自动退出时间</p>
                </div>
                <div class="px-6 py-5">
                    <form id="settingForm">
                        <div class="mb-5">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                空闲超时自动退出
                                <span class="text-xs text-gray-400 font-normal ml-1">(未操作指定时间后自动退出登录)</span>
                            </label>
                            <div class="flex items-center gap-3">
                                <input id="idleTimeout" type="range" min="15" max="1440" value="{$idle_timeout}" step="5"
                                    class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                                <span id="timeoutDisplay" class="inline-flex items-center gap-1 min-w-[80px] px-3 py-1.5 bg-orange-50 text-orange-600 rounded-lg text-sm font-medium">
                                    <span id="timeoutValue">{$idle_timeout}</span> 分钟
                                </span>
                            </div>
                            <div class="flex justify-between text-xs text-gray-400 mt-1">
                                <span>15 分钟</span>
                                <span>24 小时</span>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <button type="submit" id="submitBtn"
                                class="px-6 py-2.5 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-lg text-sm font-medium hover:shadow-lg hover:shadow-orange-500/30 transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                                保存设置
                            </button>
                            <span id="saveMsg" class="text-sm hidden"></span>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-4 bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-700">
                <div class="flex items-start gap-2">
                    <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <div>
                        <p class="font-medium mb-1">提示</p>
                        <p>设置空闲超时后，如果您在设定的时间内没有任何操作（点击、键盘输入、滚动等），系统将自动退出登录，保障账号安全。</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

{include file="common/footer" /}

<script>
(function () {
    var slider  = document.getElementById('idleTimeout');
    var display = document.getElementById('timeoutValue');
    var form    = document.getElementById('settingForm');
    var btn     = document.getElementById('submitBtn');
    var msg     = document.getElementById('saveMsg');

    slider.addEventListener('input', function () {
        display.textContent = slider.value;
        // 超过60分钟显示小时
        if (parseInt(slider.value) >= 60) {
            var h = Math.floor(slider.value / 60);
            var m = slider.value % 60;
            display.textContent = m > 0 ? h + '小时' + m + '分钟' : h + '小时';
        } else {
            display.textContent = slider.value;
        }
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = '保存中...';
        msg.classList.add('hidden');

        var body = new URLSearchParams();
        body.append('idle_timeout', slider.value);

        fetch('{:url("admin_setting/save")}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: body.toString()
        })
        .then(function (r) { return r.json(); })
        .then(function (res) {
            btn.disabled = false;
            btn.textContent = '保存设置';
            msg.classList.remove('hidden');
            if (res.code === 0) {
                msg.className = 'text-sm text-green-600';
                msg.textContent = '✓ ' + res.msg;
                // 通知父页面更新超时配置
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'idle_timeout_updated', timeout: parseInt(slider.value) }, '*');
                }
                // 更新全局 idleTimeoutMinutes
                if (typeof idleTimeoutMinutes !== 'undefined') {
                    idleTimeoutMinutes = parseInt(slider.value);
                }
            } else {
                msg.className = 'text-sm text-red-500';
                msg.textContent = '✗ ' + res.msg;
            }
            setTimeout(function () { msg.classList.add('hidden'); }, 3000);
        })
        .catch(function () {
            btn.disabled = false;
            btn.textContent = '保存设置';
            msg.classList.remove('hidden');
            msg.className = 'text-sm text-red-500';
            msg.textContent = '✗ 网络错误';
            setTimeout(function () { msg.classList.add('hidden'); }, 3000);
        });
    });
})();
</script>
</body>
</html>
